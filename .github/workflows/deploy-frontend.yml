name: Deploy frontend

on:
  push:
    branches:
      - yql_dev
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: npm run build

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SERVER_HOST}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts

      - name: Upload build artifact
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          REMOTE_ROOT: /srv/chatbot/frontend
        run: |
          test -n "${SERVER_USER}"
          ACTIVE_SLOT=$(ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" "if [ -L '${REMOTE_ROOT}/build' ]; then basename \"\$(readlink '${REMOTE_ROOT}/build')\"; else echo legacy; fi")
          if [ "${ACTIVE_SLOT}" = "legacy" ]; then
            ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${REMOTE_ROOT}/build-a' '${REMOTE_ROOT}/build-b'; if [ -d '${REMOTE_ROOT}/build' ] && [ ! -L '${REMOTE_ROOT}/build' ]; then cp -a '${REMOTE_ROOT}/build/.' '${REMOTE_ROOT}/build-a/'; cp -a '${REMOTE_ROOT}/build/.' '${REMOTE_ROOT}/build-b/'; fi"
            STAGING_SLOT=build-a
          elif [ "${ACTIVE_SLOT}" = "build-a" ]; then
            STAGING_SLOT=build-b
          else
            STAGING_SLOT=build-a
          fi
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${REMOTE_ROOT}/${STAGING_SLOT}'"
          rsync -az --delete --partial --timeout=60 -e "ssh -i ~/.ssh/deploy_key -p ${SERVER_PORT}" frontend/build/ "${SERVER_USER}@${SERVER_HOST}:${REMOTE_ROOT}/${STAGING_SLOT}/"

      - name: Activate build on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          REMOTE_ROOT: /srv/chatbot/frontend
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" <<'EOF'
          set -Eeuo pipefail
          cd /srv/chatbot/frontend
          ACTIVE_SLOT=$(if [ -L build ]; then basename "$(readlink build)"; else echo legacy; fi)
          if [ "${ACTIVE_SLOT}" = "legacy" ]; then
            STAGING_SLOT=build-a
            rm -rf build.previous
            if [ -d build ]; then
              mv build build.previous
            fi
          elif [ "${ACTIVE_SLOT}" = "build-a" ]; then
            STAGING_SLOT=build-b
          else
            STAGING_SLOT=build-a
          fi
          test -f "${STAGING_SLOT}/index.html"
          ln -sfn "${STAGING_SLOT}" build
          EOF

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          curl --fail --silent --show-error --max-time 20 "http://${SERVER_HOST}/login" >/dev/null
