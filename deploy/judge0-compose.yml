name: chatbot-judge0

services:
  server:
    image: docker.1ms.run/judge0/judge0:1.13.1
    command: ["./scripts/server"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    restart: unless-stopped
    depends_on:
      - db
      - redis

  worker:
    image: docker.1ms.run/judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      - db
      - redis

  db:
    image: docker.m.daocloud.io/library/postgres:13.0
    env_file: judge0.conf
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/library/redis:6.0
    command: ["bash", "-c", "docker-entrypoint.sh --appendonly no --requirepass $$REDIS_PASSWORD"]
    env_file: judge0.conf
    restart: unless-stopped

volumes:
  judge0-postgres-data:
