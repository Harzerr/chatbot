interface:
  display_name: resume project extractor
  short_description: 'Extract structured project experience from uploaded resume/document
    chunks. Use when a long resume,

    project report, portfolio, or candidate document has already been split into chunks
    and the caller

    needs project-level key points with traceable evidence. Each key point may and
    should reference

    multiple supporting text chunks when the fact is distributed across chunk boundaries.
    Never invent

    unsupported project details; preserve chunk IDs for downstream interview-question
    generation,

    evidence review, and resume deep-dive workflows.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
